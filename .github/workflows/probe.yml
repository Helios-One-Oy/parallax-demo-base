name: probe
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  image:
    name: image
    runs-on: craci
    steps:
      - uses: cracicorp/setup@v1
        with: { size: "1" }
      - name: Which registries can a CRACI build pull a Node base image from
        run: |
          for img in node:22-slim mirror.gcr.io/library/node:22-slim public.ecr.aws/docker/library/node:22-slim ghcr.io/nodejs/devcontainer:nightly quay.io/nodejs/node:22 cgr.dev/chainguard/node:latest; do
            printf 'FROM %s\nRUN node --version\n' "$img" > Dockerfile
            if docker build -q -t probe . >out.txt 2>&1; then echo "OK   $img"; else echo "FAIL $img: $(grep -m1 -E 'ERROR|error' out.txt | cut -c1-200)"; fi
          done
